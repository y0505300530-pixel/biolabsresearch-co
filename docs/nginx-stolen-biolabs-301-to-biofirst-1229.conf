# Old legal domain — 301 to consumer brand biofirst.co
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biolabsresearch.co www.biolabsresearch.co;
    ssl_certificate /etc/letsencrypt/live/biolabsresearch.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biolabsresearch.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://biofirst.co$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name biolabsresearch.co www.biolabsresearch.co;
    return 301 https://biofirst.co$request_uri;
}
