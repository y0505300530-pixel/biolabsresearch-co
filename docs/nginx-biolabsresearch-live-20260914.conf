    location / { try_files $uri $uri.html $uri/ =404; }

    # 2026-09-06 (витрина, этап 1): общие js правим мы, а ?v= в страницах поднимает только генератор агентов —
    # без короткого кэша исправления доезжали бы до постоянных посетителей только через 30 дней

    # Stage 4 #4 2026-09-08: long-cache video loops (immutable). add_header here
    # must restate security headers (location add_header replaces server inheritance).
    location ^~ /media/video/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://base44.app; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    location ~* \.js$ {
        expires 10m;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|svg|webp)$ {
        expires 30d;   # 2026-09-05: без add_header, см. /product-images/
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/ld+json image/svg+xml text/xml application/xml;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/biolabsresearch.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biolabsresearch.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 2026-09-05 (аудит витрины): www → апекс по HTTPS. Раньше www обслуживался основным блоком, а код витрины зовёт API
# абсолютным адресом апекса — с www браузер резал запросы как кросс-доменные, оформление заказа и запрос COA не работали.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.biolabsresearch.co;
    ssl_certificate /etc/letsencrypt/live/biolabsresearch.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biolabsresearch.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://biolabsresearch.co$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name biolabsresearch.co www.biolabsresearch.co;
    return 301 https://biolabsresearch.co$request_uri;
}
