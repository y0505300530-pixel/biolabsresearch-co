# LOCK 2026-08-25 Yehuda: biolabsresearch.co SERVES the RUO catalog
# (same storefront as biofirst.shop / /var/www/biofirst/html).
# Do NOT 301 this domain to biofirst.co telehealth.

# BioLabs Research public catalog (was BioFirst RUO storefront)
# Telehealth front remains in /var/www/biolabsresearch/html and git-front — not served here.

server {
    server_name biolabsresearch.co;   # www — отдельный блок с 301 ниже (2026-09-05)
    root /var/www/biofirst/html;
    index index.html;

    location = / {
        expires -1;   # expires, not a Cache-Control header directive here: a header directive inside a location hides every server-level one (CSP/HSTS never reached the homepage)
        try_files /index.html =404;
    }
    location = /shop { return 302 https://biolabsresearch.co/#catalog; }
    location = /index.html {
        expires -1;   # same reason as location = /
    }

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://base44.app; base-uri 'self'; form-action 'self'" always;   # 2026-09-05: без unsafe-eval (в коде витрины eval нет), frame-src для COA-документов, base-uri/form-action не наследуются от default-src

    charset utf-8;   # 2026-09-06: кодировка объявляется заголовком — вставка ниже сдвигает <meta charset> к границе 1 КБ

    # ─── 2026-09-06 (витрина, этап 2, задача 2): cookie-баннер и Consent Mode v2 ───
    # Страницы витрины регенерируют агенты босса пачками (06.09 один коммит тронул 597 файлов),
    # поэтому наш код не пишется внутрь страниц: файл лежит вне docroot, а подстановка —
    # на нашем слое, в nginx.

    # (1) Сам скрипт. Вне docroot, чтобы его не снёс и не перезаписал генератор страниц.
    # Без add_header: любая add_header внутри location отменяет наследование шести серверных
    # заголовков (CSP/HSTS/nosniff/…) — на этом уже дважды обожглись 05.09, см. AGENTS.md.
    # expires 10m — как у общих js витрины: правим файл мы, а ?v= в подстановке ниже
    # обновляется вместе с ним, так что 10 минут это потолок задержки у постоянных посетителей.
    location = /site-copy.js {
        alias /opt/shop-content/site-copy.js;
        default_type application/javascript;
        expires 10m;
    }

    location = /consent.js {
        alias /opt/shop-consent/consent.js;
        default_type application/javascript;
        expires 10m;
    }

    # (2) Подстановка в <head>. sub_filter по умолчанию обрабатывает только text/html, и
    # sub_filter_types здесь не задаётся: text/html входит в список всегда, а явное указание
    # даёт «duplicate MIME type» в nginx -t — постоянное предупреждение маскирует настоящие.
    # Порядок важен: инлайн-снипет Consent Mode v2 должен попасть в dataLayer ДО загрузчика
    # gtag/js, а он в каждой странице идёт сразу за <head> — значит вставка сразу после <head>
    # ставит consent default первым.
    # Рекламные категории всегда denied — сайт не крутит рекламу. analytics_storage снипет
    # берёт из localStorage сам: у вернувшегося посетителя, который раньше нажал Accept,
    # согласие стоит уже в consent default, и первый просмотр страницы не уходит в GA
    # безкуковым (consent.js подключён с defer и до конца разбора HTML не выполнится,
    # а wait_for_update ждёт всего 500 мс). Выбора нет или storage недоступен (приватный
    # режим — getItem бросает) — остаётся denied, аналитику включит consent.js по Accept.
    # Динамического исполнения кода в снипете нет: CSP витрины разрешает inline-скрипт,
    # но не разрешает исполнять строки.
    # sub_filter_once оставлен по умолчанию (on): каждая из строк-образцов заменяется один раз
    # за ответ. Так и нужно — <head> в странице ровно один (проверено 06.09), а повтор вставки
    # означал бы второй <script src="/consent.js"> и вторую загрузку файла.
    sub_filter '<head>' '<head>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}window.blrConsentDefault="denied";try{if(window.localStorage.getItem("blr_consent")==="granted"){window.blrConsentDefault="granted";}}catch(e){}gtag("consent","default",{ad_storage:"denied",ad_user_data:"denied",ad_personalization:"denied",analytics_storage:window.blrConsentDefault,wait_for_update:500});</script>
<script src="/consent.js?v=e02aabef" defer></script><script src="/site-copy.js?v=661f801a80" defer></script>
<style>img.article-img{max-width:100%;height:auto}@media(max-width:640px){table{display:block;max-width:100%;overflow-x:auto}a{overflow-wrap:anywhere}}</style>';

    # (3) Честный текст про cookie в политике. Строка встречается ровно один раз во всей
    # витрине (privacy-policy.html:109), поэтому отдельного location не нужно: sub_filter_once on
    # заменит её в том единственном ответе, где она есть, а на остальных страницах просто
    # не найдёт образец. Прежний текст утверждал, что трекинг-cookie нет, — на всех страницах
    # стоит Google Analytics; новый называет вещи своими именами и даёт отзыв согласия.
    # Формулировки описывают ровно то, что делает витрина: своих cookie она не ставит вовсе
    # (корзина в localStorage, document.cookie не встречается ни в одной странице и ни в одном
    # общем js), поэтому «essential cookies» из текста убраны; gtag.js грузится всегда, но до
    # согласия работает безкуковым — отсюда «no analytics cookies or identifiers … until you
    # accept» вместо «analytics stays off». Замена только из ASCII: заголовок charset ставит
    # директива charset utf-8 выше, но текст не должен от неё зависеть.
    sub_filter '    <li>Shipping carriers to deliver orders.</li>' '    <li>Shipping carriers to deliver orders.</li>
    <li>Customer.io (Peaberry Software, Inc., United States), the service that sends our email. It stores your email address, name, country, order history and, if you gave us your address on this site, the items in your cart, so that we can send order confirmations and occasional emails about your cart or our products. This data is processed in the United States. Every email we send has an unsubscribe link.</li>';
    sub_filter '  <p>We use essential cookies for cart functionality and site operation. We do not use advertising or tracking cookies.</p>' '  <p>We keep your cart in your browser (local storage) and set no cookies of our own. With your consent we also use Google Analytics, which sets cookies (<code>_ga</code>, <code>_ga_*</code>) to measure how the site is used; no analytics cookies or identifiers are stored until you accept. You can change your choice at any time in <a href="#" onclick="if(window.blrConsent){window.blrConsent.reopen();}return false;">Cookie settings</a>; declining also deletes the analytics cookies already stored.</p>';


    # ─── Block WordPress scan attacks (404 → 444 drop connection) ───
    location ~* ^/wp-admin { return 444; }
    location ~* ^/wp-login { return 444; }
    location ~* ^/wp-content { return 444; }
    location ~* ^/wp-includes { return 444; }
    location ~* ^/wp-json { return 444; }
    location ~* ^/wp-config { return 444; }
    location ~* ^/xmlrpc.php { return 444; }
    location ~* ^/wp-load { return 444; }
    location ~* /wp_filemanager { return 444; }
    location ~* /hellopress { return 444; }

    # ─── Block PHP file scans ───
    location ~* \.php$ { return 444; }
    location ~* ^/index\.php { return 444; }
    location ~* ^/admin\.php { return 444; }
    location ~* ^/config\.php { return 444; }
    location ~* ^/shell\.php { return 444; }

    # ─── Block common exploit scans ───
    location ~* ^/\.env { return 444; }
    location ~* ^/\.git { return 444; }
    location ~* ^/\.ssh { return 444; }
    location ~* /this_is_a_new_hello_world { return 444; }
    location ~* ^/vendor/ { return 444; }
    location ~* ^/storage/ { return 444; }
    location ~* ^/composer { return 444; }
    location ~* ^/cgi-bin/ { return 444; }

    location ^~ /MSOLPEPTIDES { return 404; }
    location ^~ /msolpeptides-api { return 404; }
    location ~* mastersol { return 404; }
    location ~* msolpeptides { return 404; }

    location = /products-data.json { return 404; }
    location ~* ^/(messages|orders)\.json$ { return 404; }
    location ~* (\.cjs$|\.bak|\.env$|\.py$|\.sh$) { return 404; }
    location ~ /\. { deny all; }
    # 2026-09-05 (аудит витрины): бриф генератора и черновики этикеток не для публики (листинг был 403, файлы — 200)
    location ~* ^/(_base44-brief|media/_drafts)/ { return 404; }

    location = /api/products {
        limit_req zone=bf_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/notify-order {
        limit_req zone=shop_order burst=2 nodelay;   # 2026-09-07: жёстче общей формы — заказ шлёт письмо с домена магазина
        limit_req_status 429;   # не 503: 503 у нас означает «каталог/сессии недоступны», их нельзя путать в логах
        client_max_body_size 32k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/notify-order;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/contact {
        limit_req zone=bf_form burst=5 nodelay;
        client_max_body_size 32k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/subscribe {
        limit_req zone=bf_form burst=5 nodelay;
        client_max_body_size 32k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/subscribe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/track {
        # 2026-09-07 (витрина, этап 3): события корзины из браузера. Своя зона, не форменная:
        # cart_updated уходит с debounce 5 с (до 12/мин с одной вкладки), а bf_form — 8/мин на все формы вместе,
        # то есть обычный покупатель с двумя вкладками получал бы 429 на ровном месте.
        limit_req zone=shop_track burst=15 nodelay;
        limit_req_status 429;   # не 503: 503 у нас означает «каталог/сессии недоступны»
        client_max_body_size 8k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/track;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/checkout-identify {
        # 2026-09-07 (витрина, этап 3): адрес, оставленный на странице оформления заказа, создаёт профиль
        # в Customer.io — а профили это счёт провайдера, поэтому бюджет жёстче всех остальных форм.
        limit_req zone=shop_identify burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/checkout-identify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/coupon-quote {
        # 2026-09-07 (купон): расчёт скидки на сервере для страницы оформления. Только чтение —
        # маршрут ничего не пишет, писем и событий не шлёт. Зона bf_api (8 р/с), а не форменная:
        # запрос уходит на ввод кода в поле, 8/мин покупателю мало.
        limit_req zone=bf_api burst=10 nodelay;
        limit_req_status 429;   # не 503: 503 у нас означает «каталог недоступен»
        client_max_body_size 8k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/coupon-quote;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/site-copy {
        # 2026-09-10: public read of CRM-edited Science FAQ. Writes live on CRM hosts only.
        limit_req zone=bf_api burst=20 nodelay;
        limit_req_status 429;
        limit_except GET OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/site-copy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ { return 404; }

    location ~* ^/product-images/.*\.html$ { return 404; }
    location /product-images/ {
        expires 30d;   # 2026-09-05: без add_header — директива в location скрывала серверные заголовки безопасности (CSP, HSTS, nosniff)
        try_files $uri =404;
    }

    location = /admin.html { return 404; }   # 2026-09-05: мёртвая админка витрины (её API-пути на этом хосте 404, секрет ротирован); было allow 127.0.0.1
    location = /admin { return 404; }

    # Stage1 2026-09-08: canonical clean URLs (no .html); *.html → 301 to clean
    location = /privacy { return 301 /privacy-policy; }
    location = /privacy.html { return 301 /privacy-policy; }
    location = /blog.html { return 301 /blog/; }
    location = /blog/ { try_files /blog/index.html =404; }
    location = /blog/index.html { return 301 /blog/; }
    location = /blog/index { return 301 /blog/; }

    # punch-list §9: dead duplicate pages → catalog
    location = /coming-to-catalog.html { return 301 /#catalog; }
    location = /coming-to-catalog { return 301 /#catalog; }
    location = /display-list.html { return 301 /#catalog; }
    location = /display-list { return 301 /#catalog; }
    location = /coming.html { return 301 /#catalog; }
    location = /display.html { return 301 /#catalog; }

    location = /terms { return 301 /terms-and-conditions; }
    location = /terms.html { return 301 /terms-and-conditions; }

    location = /privacy-policy { try_files /privacy-policy.html =404; }
    location = /privacy-policy.html { return 301 /privacy-policy; }
    location = /cookie-policy { try_files /cookie-policy.html =404; }
    location = /cookie-policy.html { return 301 /cookie-policy; }
    location = /cookies { return 301 /cookie-policy; }

    location = /terms-and-conditions { try_files /terms-and-conditions.html =404; }
    location = /terms-and-conditions.html { return 301 /terms-and-conditions; }
    location = /shipping { try_files /shipping.html =404; }
    location = /shipping.html { return 301 /shipping; }
    location = /returns { try_files /returns.html =404; }
    location = /returns.html { return 301 /returns; }
    location = /checkout { try_files /checkout.html =404; }
    location = /checkout.html { return 301 /checkout; }
    location = /science { try_files /science.html =404; }
    location = /science.html { return 301 /science; }
    location = /coa { try_files /coa.html =404; }
    location = /coa.html { return 301 /coa; }
    location = /coa-library { return 301 /coa; }
    location = /coa-library/ { return 301 /coa; }
    location = /coa-library.html { return 301 /coa; }

    # v1.37 — Curcumin Phytosome removed from catalog
    location = /products/curcumin-phytosome { return 301 /#catalog; }
    location = /products/curcumin-phytosome/ { return 301 /#catalog; }
    location = /products/curcumin-phytosome.html { return 301 /#catalog; }
    location = /blog/curcumin-phytosome-identity { return 301 /blog/; }
    location = /blog/curcumin-phytosome-identity/ { return 301 /blog/; }
    location = /blog/curcumin-phytosome-identity.html { return 301 /blog/; }

    location = /tools { try_files /tools.html =404; }
    location = /tools.html { return 301 /tools; }
    location = /faq { try_files /faq.html =404; }
    location = /faq.html { return 301 /faq; }
    location = /contact { try_files /contact.html =404; }
    location = /contact.html { return 301 /contact; }
    location = /guide-reading-coa { try_files /guide-reading-coa.html =404; }
    location = /guide-reading-coa.html { return 301 /guide-reading-coa; }

    # v2.95 — reconstitution vs C1V1 dilution are distinct pages
    location = /tools/reconstitution { try_files /tools/reconstitution.html =404; }
    location = /tools/reconstitution.html { return 301 /tools/reconstitution; }
