    location = /404.html { default_type text/html; }


    # 2026-09-19 Yehuda lock: public SKU is G3-R only
    location ~ ^/products/(retatrutide|r3ta|reta)(\.html)?/?$ { return 301 /products/g3-r; }
    location = /compare/tirzepatide-vs-retatrutide { return 301 /compare/tirzepatide-vs-g3-r; }
    location = /compare/tirzepatide-vs-retatrutide.html { return 301 /compare/tirzepatide-vs-g3-r; }
