# BioFirst — apex is canonical. Aliases 301 to https://biofirst.co
# mastersol / other vhosts are separate files — do not edit them here.

# HTTPS aliases → apex (same LE cert SAN)
server {
    server_name www.biofirst.co
                biofirst.fit www.biofirst.fit
                biofirst.shop www.biofirst.shop;
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/biofirst.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/biofirst.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    return 301 https://biofirst.co$request_uri;
}

# Apex HTTPS storefront
server {
    server_name biofirst.co;

    root /var/www/biofirst/html;
    index index.html;

    # Do not leak infra
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Security fix 2026-07-25: browsers must never fall back to plain HTTP for these hosts
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:" always;

    # Block old / discoverable mastersol paths on biofirst hosts
    location ^~ /MSOLPEPTIDES {
        return 404;
    }
    location ^~ /msolpeptides-api {
        return 404;
    }
    location ~* mastersol {
        return 404;
    }
    location ~* msolpeptides {
        return 404;
    }

    # Hide internals
    location = /products-data.json { return 404; }
    location ~* ^/(messages|orders)\.json$ { return 404; }
    location ~* (\.cjs$|\.bak|\.env$|\.py$|\.sh$) { return 404; }
    location ~ /\. { deny all; }

    # Public API allowlist only. The Node process behind this is a full CRM.
    # Do not proxy /api/ blindly.
    location = /api/products {
        limit_req zone=bf_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/notify-order {
        limit_req zone=bf_form burst=5 nodelay;
        client_max_body_size 32k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/notify-order;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/contact {
        limit_req zone=bf_form burst=5 nodelay;
        client_max_body_size 32k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        return 404;
    }

    location ~* ^/product-images/.*\.html$ { return 404; }
    location /product-images/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }


    # Admin is not a public storefront page
    location = /admin.html {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    location = /admin { return 404; }

    # Short legal/checkout/science paths (otherwise try_files used to 200 the homepage)
    location = /privacy { return 301 /privacy-policy.html; }
    location = /privacy.html { return 301 /privacy-policy.html; }
    location = /terms { return 301 /terms-and-conditions.html; }
    location = /terms.html { return 301 /terms-and-conditions.html; }
    location = /shipping { return 301 /shipping.html; }
    location = /returns { return 301 /returns.html; }
    location = /checkout { return 301 /checkout.html; }
    location = /science { return 301 /science.html; }
    location = /faq { try_files /faq.html =404; }
    location = /guide-reading-coa { try_files /guide-reading-coa.html =404; }

    error_page 404 /404.html;
    location = /404.html {
        default_type text/html;
    }

    # Canonicalize old blend slug
    location = /products/wolverine-blend.html {
        return 301 /products/bpc-157-tb-500-blend;
    }
    location = /products/wolverine-blend {
        return 301 /products/bpc-157-tb-500-blend;
    }

    # Clean URLs: /products/slug → /products/slug.html
    location ~ ^/products/([a-z0-9-]+)$ {
        try_files /products/$1.html /products/product.html =404;
    }

    location ~ ^/products/([a-z0-9-]+)\.html$ {
        return 301 /products/$1;
    }

    # Real pages are real files. Unknown paths and missing static files 404.
    # Catalog PDPs are handled above via /products/*.html → product.html.
    location ~* \.html$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/ld+json image/svg+xml text/xml application/xml;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/biofirst.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/biofirst.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS apex (all BioFirst names)
server {
    listen 80;
    listen [::]:80;
    server_name biofirst.co www.biofirst.co
                biofirst.fit www.biofirst.fit
                biofirst.shop www.biofirst.shop;
    return 301 https://biofirst.co$request_uri;
}
