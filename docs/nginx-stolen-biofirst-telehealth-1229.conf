# BioFirst: apex telehealth, www -> apex, .fit/.shop stay RUO catalog
# Restored 2026-08-25 after a wrong 301 to biolabsresearch.co

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.biofirst.co;
    ssl_certificate /etc/letsencrypt/live/biofirst.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biofirst.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://biofirst.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biofirst.co;
    root /var/www/biolabsresearch/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/biolabs-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://booking.portals.care; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://public-api.portals.care https://booking.portals.care; frame-src https://booking.portals.care; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* \.(bak|md|env|sql|git)$ { return 404; }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|css|js|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/snippets/biolabs-headers.conf;
    }

    location = /api/contact {
        limit_req zone=bf_form burst=5 nodelay;
        client_max_body_size 32k;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:4000/api/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/products {
        limit_req zone=bf_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000/api/products;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ =404; }

    ssl_certificate /etc/letsencrypt/live/biofirst.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biofirst.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# RUO peptide catalog — do not mix into telehealth apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biofirst.fit www.biofirst.fit biofirst.shop www.biofirst.shop;
    root /var/www/biofirst/html;
    index index.html;
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ^~ /MSOLPEPTIDES { return 404; }
    location ^~ /msolpeptides-api { return 404; }
    location ~* mastersol { return 404; }
    location ~* msolpeptides { return 404; }
    location = /products-data.json { return 404; }
    location ~* ^/(messages|orders)\.json$ { return 404; }
    location ~* (\.cjs$|\.bak|\.env$|\.py$|\.sh$) { return 404; }
    location ~ /\. { deny all; }

    location = /api/products {
        limit_req zone=bf_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/contact {
        limit_req zone=bf_form burst=5 nodelay;
        client_max_body_size 32k;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:4000/msolpeptides-api/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }

    ssl_certificate /etc/letsencrypt/live/biofirst.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biofirst.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name biofirst.co www.biofirst.co;
    return 301 https://biofirst.co$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name biofirst.fit www.biofirst.fit biofirst.shop www.biofirst.shop;
    return 301 https://$host$request_uri;
}
