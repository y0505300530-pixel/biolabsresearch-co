        stroke="#2d7a52" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Helix rungs -->
  <line x1="54" y1="26" x2="62" y2="25" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="61" y2="32" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="38" x2="62" y2="39" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="44" x2="63" y2="44" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="50" x2="62" y2="50" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="56" x2="61" y2="57" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="62" x2="62" y2="62" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="68" x2="61" y2="68" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="74" x2="62" y2="74" stroke="#1a5c38" stroke-width="1.5" stroke-linecap="round"/>
</svg>
